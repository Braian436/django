# ============================================================
# docker-compose.yml base | Proyecto Django + Postgres
# ISDEM - Práctica Profesional II - Prof. Lic. Adrián Aguirre
#
# Servicios:
#   - db  -> base de datos Postgres
#   - web -> aplicación Django
# ============================================================

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberia_db}
      POSTGRES_USER: ${POSTGRES_USER:-barberia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberia_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "clave-secreta-de-desarrollo-cambiar-en-produccion"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-6543}

volumes:
  postgres_data: